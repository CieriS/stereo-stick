# Scans the whole history, every branch and tag, for committed secrets (gitleaks). Installed by
# _infra/scripts/install-repo-guards.sh. Fake values in tests go in .gitleaksignore (fingerprints).
# The image is pinned by digest: update tag and digest together.
name: Secret scan

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: >
          docker run --rm -e GIT_CONFIG_PARAMETERS="'safe.directory=*'" -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner --verbose --log-opts="--all"
