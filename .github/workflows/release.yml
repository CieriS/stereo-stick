name: Release

# A tag like v0.1.0 builds the installers and attaches them to a draft
# release. Pull requests that touch the packaging build them too, as a test,
# and keep them as workflow artifacts.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - app/scripts/**
      - app/src-tauri/tauri.conf.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install the libraries the desktop shell needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install frontend dependencies
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Fetch the tools the app ships with
        working-directory: app
        run: bun run fetch-tools
      - name: Build the installers
        working-directory: app
        run: bun run tauri build
      - name: Collect the installers
        shell: bash
        run: |
          mkdir installers
          find target/release/bundle -type f \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp {} installers/ \;
          ls -l installers
          test -n "$(ls installers)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ runner.os }}
          path: installers/
          if-no-files-found: error
      - name: Attach the installers to a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --draft --generate-notes --title "$TAG"
          gh release upload "$TAG" installers/* --clobber
